name: Portable package smoke
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated runtime and release
        run: bash scripts/cloud-setup.sh
      - name: Check launcher guards
        run: .runtime/python/bin/python -m unittest discover -s tests -v
      - name: Check synthetic Excel and PDF
        run: python3 scripts/smoke.py --render --out outputs/linux-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-linux-smoke
          path: outputs/linux-smoke
